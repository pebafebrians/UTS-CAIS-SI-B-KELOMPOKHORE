<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CAIS</title>
    <!-- Path CSS mundur satu folder karena login.html ada di dalam pages/ -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="login-container">
        <h2>Login CAIS</h2>
        <p class="subtitle">Collaborative Academic Information System</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Masukkan username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Masukkan password" required>
            </div>

            <button type="submit" class="btn-login">Login</button>
            <p id="errorMsg" class="error-msg"></p>
        </form>

        <p class="back-link"><a href="../index.html">&larr; Kembali ke Beranda</a></p>
    </div>

    <!-- Path JS mundur satu folder -->
    <script src="../js/script.js"></script>
</body>
</html>
